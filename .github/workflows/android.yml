name: Android debug APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build debug apk
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Setup JDK (для AGP 8.13 / Gradle 8.14)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Build web
        working-directory: web
        run: npm run build

      - name: Capacitor sync (android)
        working-directory: web
        env:
          CAP_SERVER_URL: ${{ vars.APP_URL }}
        run: |
          if [ -n "${CAP_SERVER_URL}" ]; then
            echo "APP_URL задан: приложение будет грузить удалённую сборку"
          else
            echo "APP_URL не задан: встроенный режим (dist внутри APK)"
          fi
          npx cap sync android

      - name: Assemble debug APK
        working-directory: web/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: runwave-android-debug
          path: web/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
